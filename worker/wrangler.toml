name = "cep-fabrikasi"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# "gemini" (ücretsiz katman, varsayılan) veya "anthropic" (gelir gelince)
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Hız için düşük düşünme seviyesi ("low" / "high"; boş = model varsayılanı)
GEMINI_THINKING = "low"
ANTHROPIC_MODEL = "claude-opus-5-5"
# Cihaz başına günlük üretim limiti (ücretsiz katmanı korumak için)
DAILY_LIMIT_PER_DEVICE = "20"
REPORTS_TO_HIDE = "3"
APK_URL = "https://github.com/cech56/cep-fabrikasi/releases"

# Gizli anahtarlar koda yazılmaz, şu komutlarla eklenir:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY   (sadece anthropic'e geçince)

# Veritabanı (D1): GitHub Actions yayında otomatik oluşturur ve buraya ekler.
# Yerelde denemek için: npx wrangler d1 create cep-fabrikasi
