name: Sunucuyu kur ve APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  worker:
    name: Ara sunucu (Cloudflare)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: workers.dev alt alan adını hazırla
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          current=$(curl -s -H "$auth" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$current" ]; then echo "Mevcut alt alan adı: $current"; exit 0; fi
          name="cepfabrikasi-$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-6)"
          echo "Alt alan adı kaydediliyor: $name"
          curl -s -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api" | jq '{success, errors}'
      - name: Veritabanını (D1) hazırla
        # Yetki yoksa sunucu veritabanısız çalışmaya devam eder (paylaşma/vitrin kapalı).
        continue-on-error: true
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          list=$(curl -s -H "$auth" "$api?name=cep-fabrikasi")
          if [ "$(echo "$list" | jq -r '.success')" != "true" ]; then
            echo "$list" | jq '.errors'
            echo "::warning::Veritabanına erişilemedi. Cloudflare token'ına 'Account > D1 > Edit' yetkisi eklenmeli."
            exit 1
          fi
          id=$(echo "$list" | jq -r '.result[] | select(.name=="cep-fabrikasi") | .uuid' | head -1)
          if [ -z "$id" ]; then
            created=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" --data '{"name":"cep-fabrikasi"}' "$api")
            echo "$created" | jq '{success, errors}'
            id=$(echo "$created" | jq -r '.result.uuid // empty')
          fi
          [ -n "$id" ] || exit 1
          sql=$(jq -Rs '{sql: .}' schema.sql)
          res=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" --data "$sql" "$api/$id/query")
          echo "$res" | jq '{success, errors}'
          [ "$(echo "$res" | jq -r '.success')" = "true" ] || exit 1
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "cep-fabrikasi"\ndatabase_id = "%s"\n' "$id" >> wrangler.toml
          echo "D1 hazır: $id"
      - name: Yayınla
        id: deploy
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            if grep -q "Invalid access token\|Authentication error" deploy.log; then
              echo "::error::Cloudflare token geçersiz. My Profile > API Tokens > Create Token > 'Edit Cloudflare Workers' şablonuyla yeni token oluşturup CLOUDFLARE_API_TOKEN secret'ını güncelle."
            fi
            exit 1
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::workers.dev adresi bulunamadı. Cloudflare panelinde Workers & Pages sayfasını bir kez açıp workers.dev alt alan adını seçmen gerekebilir."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Gemini anahtarını sunucuya gizli olarak ekle
        run: printf '%s' "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
      - name: Sağlık kontrolü
        # Yeni workers.dev adresinin sertifikası birkaç dakika sürebilir; APK derlemesini bekletmez.
        continue-on-error: true
        run: |
          for i in $(seq 1 12); do curl -fsS "${{ steps.deploy.outputs.url }}/health" && exit 0; sleep 15; done
          exit 1

  changes:
    name: Değişiklik kontrolü
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD~1 HEAD | grep -qvE '^(worker/|\.github/workflows/smoke\.yml)'; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  apk:
    name: Android APK
    needs: [worker, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ needs.worker.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk cep-fabrikasi-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cep-fabrikasi-apk
          path: cep-fabrikasi-*.apk
      - name: İndirme linki için sürüm oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deneme-${{ github.run_number }}
          name: Deneme sürümü ${{ github.run_number }}
          prerelease: true
          body: Telefonundan bu sayfayı açıp APK dosyasına dokun, indir ve kur.
          files: cep-fabrikasi-*.apk
