name: Sunucu üretim testi

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Test isteği
        default: Basit bir sayaç uygulaması, artı ve eksi butonu olsun
      url:
        description: Sunucu adresi
        default: https://cep-fabrikasi.cepfabrikasi-94cac6.workers.dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Üret ve sonucu göster
        run: |
          start=$(date +%s)
          body=$(jq -n --arg p "${{ inputs.prompt }}" '{prompt: $p, deviceId: "ci-smoke"}')
          curl -sS -m 300 -X POST "${{ inputs.url }}/generate" -H 'content-type: application/json' -d "$body" -o out.json -w 'HTTP %{http_code}\n'
          echo "Süre: $(( $(date +%s) - start )) sn"
          jq -r 'if .error then "HATA: " + .error elif .refused then "RED: " + .reason else "OK: " + .name + " " + .emoji + " (" + (.html|length|tostring) + " karakter)" end' out.json || head -c 1000 out.json
      - uses: actions/upload-artifact@v4
        with:
          name: uretilen-uygulama
          path: out.json
      - name: Erişilebilen Gemini flash modelleri
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" | jq -r '.models[] | select(.name|test("flash")) | .name + (if .thinking then " (thinking)" else "" end)'
